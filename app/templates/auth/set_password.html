<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            color: #f8fafc;
            background: linear-gradient(135deg, #17152c 0%, #27224a 48%, #144d59 100%);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-card {
            width: min(92vw, 440px);
            padding: 2.25rem;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 1.25rem;
            background: rgba(15, 23, 42, .82);
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .3);
        }
        .login-mark {
            width: 3.5rem;
            height: 3.5rem;
            display: grid;
            place-items: center;
            margin-bottom: 1rem;
            border-radius: 1rem;
            color: #fff;
            background: linear-gradient(135deg, #a78bfa, #2dd4bf);
            font-size: 1.75rem;
            font-weight: 700;
        }
        .form-control { color: #0f172a; }
        .btn-primary {
            border: 0;
            background: linear-gradient(135deg, #8b5cf6, #14b8a6);
        }
        .btn-primary:hover, .btn-primary:focus { background: linear-gradient(135deg, #7c3aed, #0d9488); }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-mark" aria-hidden="true">A</div>
        <h1 class="h3 mb-2">Установите пароль</h1>
        <p class="text-light-emphasis mb-4">
            Пароль для <strong class="text-white">{{ email }}</strong> будет сохранён для последующих входов.
        </p>
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/auth/set-password">
            <input type="hidden" name="next" value="{{ next_path }}">
            <div class="mb-3">
                <label for="password" class="form-label">Новый пароль</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg" minlength="{{ password_min_length }}" autocomplete="new-password" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password-confirmation" class="form-label">Повторите пароль</label>
                <input id="password-confirmation" name="password_confirmation" type="password" class="form-control form-control-lg" minlength="{{ password_min_length }}" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Сохранить пароль</button>
        </form>
    </main>
</body>
</html>
