<div id="kanban-filters" class="kanban-filter-controls">
    {% if show_project_filter|default(true) %}
    <div class="mb-3">
        <label class="form-label" for="filter-project">Проект</label>
        <select class="form-select" id="filter-project" data-multi-filter onchange="applyFilters()">
            <option value="">Все проекты</option>
        </select>
    </div>
    {% endif %}
    <div class="mb-3">
        <label class="form-label" for="filter-priority">Приоритет</label>
        <select class="form-select" id="filter-priority" data-multi-filter onchange="applyFilters()">
            <option value="">Все</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="filter-assignee">Ответственный</label>
        <select class="form-select" id="filter-assignee" data-multi-filter onchange="applyFilters()">
            <option value="">Все</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="filter-list">Список</label>
        <select class="form-select" id="filter-list" data-multi-filter onchange="applyFilters()">
            <option value="">Все</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="filter-tag">Тег</label>
        <select class="form-select" id="filter-tag" data-multi-filter onchange="applyFilters()">
            <option value="">Все</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="filter-due-before">Дедлайн до</label>
        <input type="date" class="form-control" id="filter-due-before" onchange="applyFilters()">
    </div>
    <div class="mb-3">
        <label class="form-label" for="filter-created-after">Создано с</label>
        <input type="date" class="form-control" id="filter-created-after" onchange="applyFilters()">
    </div>
    <div class="mb-3">
        <label class="form-label" for="filter-created-before">Создано до</label>
        <input type="date" class="form-control" id="filter-created-before" onchange="applyFilters()">
    </div>
    <button class="btn btn-outline-gray kanban-reset-btn w-100" type="button" onclick="resetFilters()" title="Сбросить фильтры">
        <i class="bi bi-x-lg"></i> Сбросить
    </button>
</div>
