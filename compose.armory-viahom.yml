services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: armory-viahom:latest
    container_name: armory-viahom
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARMORY_HOST_PORT:-18088}:8088"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - collabora
    environment:
      PORT: 8088
      AUTH_REQUIRED: "true"
      AUTH_MODE: magic_link
      COLLABORA_ENABLED: "true"
      COLLABORA_INTERNAL_URL: http://collabora:9980
      COLLABORA_SERVICE_ROOT: /collabora
      COLLABORA_WOPI_INTERNAL_URL: http://app:8088
      EXTENSION_MANAGER_URL: ""
      SMTP_PORT: 2525
      SMTP_USE_SSL: "false"
      SMTP_USE_TLS: "true"
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8088

  collabora:
    image: collabora/code:latest
    container_name: armory-viahom-collabora
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "9980"
    environment:
      domain: "${COLLABORA_DOMAIN:-example\\.com}|app"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:wopi.host[@allow]=app --o:net.service_root=/collabora --o:welcome.enable=false"
      dictionaries: "ru_RU en_US"
      username: "${COLLABORA_ADMIN_USER:-admin}"
      password: "${COLLABORA_ADMIN_PASSWORD:-change-me}"
    cap_add:
      - MKNOD
