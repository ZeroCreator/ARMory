services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: armory:latest
    container_name: armory
    restart: unless-stopped
    mem_limit: "${ARMORY_APP_MEMORY_LIMIT:-1g}"
    memswap_limit: "${ARMORY_APP_MEMORY_LIMIT:-1g}"
    cpus: "${ARMORY_APP_CPU_LIMIT:-2.0}"
    expose:
      - "${PORT:-8088}"
    volumes:
      - ./data:/app/data
      - ./armory.db:/app/armory.db
      # SSH-ключ планировщика (read-only; приложение само скопирует с правами 0600)
      - ${SCHEDULER_SSH_KEY_HOST:-./deploy/id_ed25519}:/app/ssh/id_ed25519:ro
    env_file:
      - .env
    environment:
      EXTENSION_MANAGER_URL: http://extension-manager:8092
      ARMORY_BASE_URL: http://localhost:${PORT:-8088}
    networks:
      - armory-net

  extension-manager:
    image: armory:latest
    container_name: armory-extension-manager
    restart: unless-stopped
    command: /app/.venv/bin/uvicorn app.extension_manager:app --host=0.0.0.0 --port=8092
    expose:
      - "8092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - armory-net

  collabora:
    image: docker.io/collabora/code@sha256:4e983196eb9878f339cc506c38c21f1cc3473bca3d6de883c5de08f9c0cc3a6c
    container_name: armory-collabora
    restart: unless-stopped
    expose:
      - "9980"
    environment:
      - domain=${COLLABORA_DOMAIN:-armory\.team-73\.ru}|app
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:wopi.host[@allow]=app --o:net.service_root=/collabora --o:welcome.enable=false
      - dictionaries=ru_RU en_US
      - username=${COLLABORA_ADMIN_USER:-admin}
      - password=${COLLABORA_ADMIN_PASSWORD:-changeme}
    cap_add:
      - MKNOD
    networks:
      - armory-net

networks:
  armory-net:
