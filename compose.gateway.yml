services:
  app:
    environment:
      AUTH_REQUIRED: "true"
      AUTH_MODE: "proxy"

  gateway:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    container_name: oauth2-proxy
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-5005}:4180"
    environment:
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=http://app:${PORT:-8088}
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://mail.team-73.ru
      - OAUTH2_PROXY_LOGIN_URL=https://mail.team-73.ru/authorize/code
      - OAUTH2_PROXY_REDEEM_URL=https://mail.team-73.ru/auth/token
      - OAUTH2_PROXY_OIDC_JWKS_URL=https://mail.team-73.ru/auth/jwks.json
      - OAUTH2_PROXY_VALIDATE_URL=https://mail.team-73.ru/auth/userinfo
      - OAUTH2_PROXY_REDIRECT_URL=https://armory.team-73.ru/oauth2/callback
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      # Запрашиваем offline_access, чтобы обновлять access token без повторного входа.
      - OAUTH2_PROXY_SCOPE=openid offline_access
      - OAUTH2_PROXY_COOKIE_REFRESH=30m
      # Срок cookie должен быть не меньше срока refresh-токена провайдера; для Stalwart по умолчанию это 30 дней.
      - OAUTH2_PROXY_COOKIE_EXPIRE=${OAUTH2_PROXY_COOKIE_EXPIRE:-720h}
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_SESSION_STORE_TYPE=redis
      - OAUTH2_PROXY_REDIS_CONNECTION_URL=redis://session-store:6379
      - OAUTH2_PROXY_API_ROUTES=^/api
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY=false
      - OAUTH2_PROXY_REQUEST_TIMEOUT=0
      # WOPI endpoints вызываются изнутри Collabora, без cookie пользователя.
      # OAuth-браузерный вход для MCP проходит через oauth2-proxy; остальные протокольные маршруты проверяет ARMory.
      - OAUTH2_PROXY_SKIP_AUTH_ROUTES=^/wopi/.*$,^/mcp$,^/mcp/$,^/mcp/(token|register|revoke)$,^/mcp/\.well-known/(oauth-authorization-server|oauth-protected-resource)$,^/\.well-known/oauth-protected-resource$,^/\.well-known/oauth-protected-resource/mcp$,^/\.well-known/oauth-authorization-server/mcp$
      # Разрешить oauth2-proxy проксировать WebSocket upgrade запросы на ARMory.
      - OAUTH2_PROXY_PROXY_WEBSOCKETS=true
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      session-store:
        condition: service_healthy
    networks:
      - armory-net

  session-store:
    image: docker.io/library/redis:7-alpine
    container_name: oauth2-proxy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - oauth2-proxy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - armory-net

networks:
  armory-net:

volumes:
  oauth2-proxy-redis-data:
